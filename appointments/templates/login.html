{% extends 'base.html' %}
{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white border border-slate-100 shadow-xl rounded-2xl p-8">

            <!-- Header -->
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-slate-800">Welcome Back</h3>
                <p class="text-sm text-slate-500 mt-1">
                    Login to continue booking appointments
                </p>
            </div>

            <!-- Form -->
            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Username
                    </label>
                    <input type="text" name="username" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Password
                    </label>
                    <input type="password" name="password" required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>

                <!-- Button -->
                <button type="submit"
                        class="w-full bg-primary text-white py-3 rounded-xl font-semibold shadow-md hover:opacity-90 transition">
                    Login
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center text-sm text-slate-500 mt-6">
                No account?
                <a href="{% url 'register' %}" class="text-primary font-medium hover:underline">
                    Register
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
