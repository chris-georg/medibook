{% extends 'base.html' %}
{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="w-full max-w-xl">

        <!-- MAIN CARD -->
        <div class="bg-white border border-slate-100 shadow-xl rounded-2xl p-8">

            <!-- HEADER -->
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-slate-800">
                    Book an Appointment
                </h3>
                <p class="text-sm text-slate-500 mt-1">
                    Choose a doctor, date, and available time slot
                </p>
            </div>

            <!-- FORM -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <!-- DOCTOR -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Doctor
                    </label>

                    <select name="doctor" id="doctorSelect"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>

                        <option value="">-- Select a Doctor --</option>

                        {% for doctor in doctors %}
                            <option value="{{ doctor.pk }}">
                                Dr. {{ doctor.name }} — {{ doctor.specialization }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <!-- DATE -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Date
                    </label>

                    <input type="date" name="date" id="dateInput"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>
                </div>

                <!-- TIME SLOTS -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Available Time Slots
                    </label>

                    <select name="time" id="timeSelect"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required>

                        <option value="">-- Select doctor and date first --</option>

                    </select>

                    <small id="slotMessage" class="text-red-500 text-sm mt-2 block"></small>
                </div>

                <!-- REASON -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">
                        Reason for Visit
                    </label>

                    <textarea name="reason" rows="3"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        required></textarea>
                </div>

                <!-- BUTTON -->
                <button type="submit"
                    class="w-full bg-primary text-white py-3 rounded-xl font-semibold shadow-md hover:opacity-90 transition">
                    Book Appointment
                </button>

            </form>

        </div>

        <!-- INFO CARD -->
        <div class="mt-4 bg-slate-50 border border-slate-100 rounded-2xl p-4 text-sm text-slate-600">

            🕐 <strong>Working Hours:</strong> 8:00AM – 1:00PM & 3:00PM – 6:00PM <br>
            📅 <strong>Slots:</strong> 15-minute intervals <br>
            🚫 No bookings on Sundays

        </div>

    </div>

</div>

<!-- SCRIPT (UNCHANGED LOGIC) -->
<script>
    const doctorSelect = document.getElementById('doctorSelect');
    const dateInput = document.getElementById('dateInput');
    const timeSelect = document.getElementById('timeSelect');
    const slotMessage = document.getElementById('slotMessage');

    // Set minimum date to today
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    function loadSlots() {
        const doctorId = doctorSelect.value;
        const date = dateInput.value;

        if (!doctorId || !date) return;

        timeSelect.innerHTML = '<option>Loading slots...</option>';
        slotMessage.textContent = '';

        fetch(`/get-slots/?doctor_id=${doctorId}&date=${date}`)
            .then(res => res.json())
            .then(data => {

                timeSelect.innerHTML = '';

                if (!data.slots || data.slots.length === 0) {
                    timeSelect.innerHTML = '<option value="">No slots available</option>';
                    slotMessage.textContent = data.message || "No available slots";
                    return;
                }

                timeSelect.innerHTML = '<option value="">-- Select a time slot --</option>';

                data.slots.forEach(slot => {
                    const option = document.createElement('option');
                    option.value = slot;
                    option.textContent = slot;
                    timeSelect.appendChild(option);
                });
            });
    }

    doctorSelect.addEventListener('change', loadSlots);
    dateInput.addEventListener('change', loadSlots);
</script>

{% endblock %}
