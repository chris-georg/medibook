{% extends 'base.html' %}
{% block content %}

<div class="min-h-[80vh] flex items-center justify-center px-4">

    <div class="w-full max-w-md">

        <!-- Card -->
        <div class="bg-white border border-slate-100 shadow-xl rounded-2xl p-8">

            <!-- Header -->
            <div class="text-center mb-6">
                <h3 class="text-2xl font-bold text-slate-800">Create Account</h3>
                <p class="text-sm text-slate-500 mt-1">
                    Join MediBook and start booking appointments
                </p>
            </div>

            <!-- Form -->
            <form method="POST" class="space-y-4">
                {% csrf_token %}

                {% for field in form %}
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">
                            {{ field.label }}
                        </label>

                        <div class="w-full">
                            {{ field }}
                        </div>

                        {% if field.errors %}
                            <p class="text-sm text-red-500 mt-1">
                                {{ field.errors }}
                            </p>
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Button -->
                <button type="submit"
                        class="w-full mt-4 bg-primary text-white py-3 rounded-xl font-semibold shadow-md hover:opacity-90 transition">
                    Register
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center text-sm text-slate-500 mt-6">
                Already have an account?
                <a href="{% url 'login' %}" class="text-primary font-medium hover:underline">
                    Login
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
