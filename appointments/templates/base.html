<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediBook</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0d6efd',
                        soft: '#f5f7fb',
                        accent: '#00c2a8'
                    }
                }
            }
        }
    </script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-soft text-slate-800">

<!-- NAVBAR -->
<nav class="sticky top-0 z-50 bg-white/70 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

        <!-- Brand -->
        <a href="{% url 'home' %}" class="text-xl font-bold text-primary flex items-center gap-2">
            🏥 MediBook
        </a>

        <!-- Links -->
        <div class="flex items-center gap-6 text-sm font-medium">

            {% if user.is_authenticated %}

                {% if not user.is_staff %}
                <a href="{% url 'dashboard' %}"
                   class="text-slate-600 hover:text-primary transition">
                    Dashboard
                </a>
                {% endif %}

                {% if user.is_staff %}
                    <a href="{% url 'admin_dashboard' %}"
                       class="text-slate-600 hover:text-primary transition">
                        Admin
                    </a>
                {% endif %}

                <a href="{% url 'logout' %}"
                   class="px-4 py-2 rounded-xl bg-primary text-white hover:opacity-90 transition shadow-sm">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}"
                   class="text-slate-600 hover:text-primary transition">
                    Login
                </a>

                <a href="{% url 'register' %}"
                   class="px-4 py-2 rounded-xl bg-primary text-white hover:opacity-90 transition shadow-sm">
                    Register
                </a>

            {% endif %}

        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="max-w-6xl mx-auto px-6 py-10">

    <!-- Messages -->
    {% for message in messages %}
        <div class="mb-4 px-4 py-3 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 shadow-sm">
            {{ message }}
        </div>
    {% endfor %}

    <!-- Page Content -->
    <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
        {% block content %}{% endblock %}
    </div>

</main>

</body>
</html>
